<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="logoGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2D6A4F" />
            <stop offset="55%" stop-color="#1B4332" />
            <stop offset="100%" stop-color="#0B1911" />
        </linearGradient>
        <linearGradient id="tentGrad" x1="12" y1="16" x2="36" y2="36" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FBBF24" />
            <stop offset="100%" stop-color="#D97706" />
        </linearGradient>
        <linearGradient id="peakGrad" x1="10" y1="10" x2="38" y2="30" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#95D5B2" />
            <stop offset="100%" stop-color="#52B788" />
        </linearGradient>
        <filter id="shadow" x="0" y="0" width="48" height="48" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1B4332" flood-opacity="0.2"/>
        </filter>
    </defs>
    
    <!-- Outer Badge with Rounded Corners -->
    <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#logoGrad)" filter="url(#shadow)" />
    
    <!-- North Star / Camp Sky Accent -->
    <circle cx="33" cy="13" r="2" fill="#FDE68A" />
    
    <!-- Distant Mountain Peaks -->
    <path d="M9 32L18 15L25 25L30 18L39 32H9Z" fill="url(#peakGrad)" opacity="0.45" />
    
    <!-- Classic A-Frame Adventure Tent -->
    <path d="M24 16L36 34H12L24 16Z" fill="url(#tentGrad)" />
    
    <!-- Tent Inner Entrance Flap -->
    <path d="M24 23L29 34H19L24 23Z" fill="#0B1911" opacity="0.85" />
    
    <!-- Tent Ridge Pole & Ground Line -->
    <path d="M24 14V23" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
    <path d="M10 34H38" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
</svg>